# Keep the GitHub Actions used by CI on supported versions.
# Updates arrive as PRs; auto-merge.yml never auto-merges .github/ changes,
# so each one waits for CI and a manual merge.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
