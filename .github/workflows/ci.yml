name: Unified Publication & Verification Build

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NIX_ARCH: "x86_64-linux"
  PYTHONUNBUFFERED: "1"

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  # Stage 1: Environment Gating & Evaluation
  core-gating:
    name: Core Nix Verification Gating
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nix
        uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=flake:nixpkgs
          extra_nix_config: |
            sandbox = true

      - name: Dry-run Evaluate macOS Targets
        run: |
          echo "Evaluating packages on aarch64-darwin..."
          nix eval .#packages.aarch64-darwin --apply "builtins.mapAttrs (n: v: v.drvPath)"
          
          echo "Evaluating devShells on aarch64-darwin..."
          nix eval .#devShells.aarch64-darwin --apply "builtins.mapAttrs (n: v: v.drvPath)"
          
          echo "Evaluating checks on aarch64-darwin..."
          nix eval .#checks.aarch64-darwin --apply "builtins.mapAttrs (n: v: v.drvPath)"

      - name: Run Formatting Check
        run: nix build .#checks.${NIX_ARCH}.formatting

      - name: Run Warnings Check
        run: nix build .#checks.${NIX_ARCH}.warnings

      - name: Run Rust Literals Check
        run: nix build .#checks.${NIX_ARCH}.rust-literals

      - name: Run LaTeX Paper Verification
        run: nix build .#checks.${NIX_ARCH}.latex-paper

      - name: Prepare PDF Artifact
        if: success()
        run: |
          OUT_PATH=$(nix build .#checks.${NIX_ARCH}.latex-paper --print-out-paths)
          cp "$OUT_PATH/main.pdf" ./main.pdf

      - name: Upload Compiled PDF
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-paper
          path: main.pdf
          if-no-files-found: error

  verify-verus:
    name: Verus Semantic Verification
    runs-on: ubuntu-latest
    needs: core-gating
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nix
        uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=flake:nixpkgs
          extra_nix_config: |
            sandbox = true

      - name: Run Verus Semantic Verification via Nix
        run: nix build .#checks.${NIX_ARCH}.verus-proofs

  # Stage 2: Parallel Quality Verification (Rust, Lean, and Python)
  verify-and-build:
    name: Build and Verify
    runs-on: ubuntu-latest
    needs: [core-gating, verify-verus]
    permissions:
      contents: read
      actions: write
      pull-requests: write
    env:
      SSL_CERT_FILE: "/etc/ssl/certs/ca-certificates.crt"
      GIT_SSL_CAINFO: "/etc/ssl/certs/ca-certificates.crt"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nix (Linux)
        uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=flake:nixpkgs
          extra_nix_config: |
            sandbox = true

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          work-directories: ualbf-project

      - name: Populate Pre-built Lean Objects
        run: |
          nix build .#packages.${NIX_ARCH}.lean -o ualbf-project/lean-built
          chmod -R +w ualbf-project/lean4-proofs || true
          rm -rf ualbf-project/lean4-proofs/.lake || true
          cp -rL ualbf-project/lean-built/.lake ualbf-project/lean4-proofs/.lake
          chmod -R +w ualbf-project/lean4-proofs/.lake || true
          python3 -c "import os; proofs = 'ualbf-project/lean4-proofs'; [os.utime(os.path.join(r, f), (1767225600, 1767225600) if (('build' in r.split(os.sep) or f.endswith(('.olean', '.ilean', '.trace', '.hash', '.o', '.ot', '.a', '.so', '.dylib', '.dll', '.rsp', '.c'))) and not f.endswith('.lean')) else (1577836800, 1577836800)) for r, _, fs in os.walk(proofs) for f in fs]" || true
          nix develop --command bash -c "cd ualbf-project && make verification-lib"

      - name: Run Unified Quality Checks
        run: |
          nix develop --command bash -c "cd ualbf-project && make check-core" > make_check.log 2>&1 || {
            cat make_check.log
            exit 1
          }

      - name: Post Failure Log to PR
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f make_check.log ] && [ -n "${{ github.event.pull_request.number }}" ]; then
            echo "Posting make check failure log to PR..."
            # Escape backticks and format the log safely
            echo "### CI Failure Log" > comment_body.txt
            echo '```' >> comment_body.txt
            cat make_check.log >> comment_body.txt
            echo '```' >> comment_body.txt
            gh pr comment ${{ github.event.pull_request.number }} --body-file comment_body.txt || echo "Failed to post PR failure log comment"
          fi

      - name: Verify Workspace Cleanliness
        run: nix develop --command bash -c "cd ualbf-project && make verify-sync"

      - name: Run Core Logic Tests (dfs_tree)
        run: nix develop --command bash -c "cd ualbf-project/rust-engine && cargo test --release dfs_tree"

      - name: Run Core Logic Tests (lean_ffi)
        run: nix develop --command bash -c "cd ualbf-project/rust-engine && cargo test --release lean_ffi"

      - name: Upload Rust Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage-xml
          path: ualbf-project/coverage.xml
          if-no-files-found: ignore

  verify-python:
    name: Run Python Quality Checks
    runs-on: ubuntu-latest
    needs: [core-gating, verify-verus]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nix (Linux)
        uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=flake:nixpkgs
          extra_nix_config: |
            sandbox = true

      - name: Cache Pip Packages
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          work-directories: ualbf-project

      - name: Run Python Quality Checks
        run: nix develop --command bash -c "cd ualbf-project && make check-python"

      - name: Upload Python Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-xml
          path: ualbf-project/coverage.xml
          if-no-files-found: ignore

  verify-paper-sync:
    name: Verify Paper Macros & Compliance
    runs-on: ubuntu-latest
    needs: core-gating
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nix (Linux)
        uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=flake:nixpkgs
          extra_nix_config: |
            sandbox = true

      - name: Run Paper Sync & Compliance Checks
        run: nix develop --command bash -c "cd ualbf-project && make check-paper"



