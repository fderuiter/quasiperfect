[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ualbf"
version = "0.1.0"
dependencies = []

[tool.setuptools]
package-dir = {"" = "ualbf-project"}
py-modules = ["cert_util", "verify_cert", "auditor", "verify_metadata"]

[tool.black]
# Exclude standard build directories, Lean packages, Nix outputs, and various local python virtual environments
# (including venv, .venv, .direnv, test-env, env, .env) to keep the formatting scans highly performant.
extend-exclude = 'scripts|tests|prototypes|experimental|\.lake|venv|\.venv|\.direnv|lean-built|result|test-env|env|\.env'

[tool.mypy]
# Exclude paths from static analysis to avoid false type errors in external dependencies
exclude = [
    'scripts/',
    'tests/',
    'prototypes/',
    'experimental/',
    '\.lake/',
    'venv/',
    '\.venv/',
    '\.direnv/',
    'lean-built/',
    'result/',
    'test-env/',
    'env/',
    '\.env/'
]

[tool.pytest.ini_options]
# Python unit tests execute via pytest across standard workspace targets.
# The local suite is fully decoupled and can be executed via `make check-python`.
# Note: some unit tests compile rust-engine/z3-sys as subprocesses and require Z3 development headers (libz3-dev / pkgs.z3.dev).
# Parallel quality gating workflows ensure robust testing without blockages.
# Ignore certificate verification tests as they depend on live network resources/keys
# and are executed as part of custom manual/isolated validation suites.
pythonpath = ["ualbf-project"]
norecursedirs = ["scripts", "prototypes", "experimental", ".lake"]
addopts = "--ignore=ualbf-project/tests/test_verify_cert.py --ignore=tests/test_verify_cert.py"

